version: '3.8'

services:
  echofront-postgres:
    image: postgres:16-alpine
    container_name: echofront_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: echofront_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  echofront-redis:
    image: redis:7.2-alpine
    container_name: echofront_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  echofront-backend:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.backend
    container_name: echofront_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@echofront-postgres:5432/echofront_db
      REDIS_URL: redis://echofront-redis:6379/0
      ENVIRONMENT: production
      DEBUG: "false"
    ports:
      - "8000:8000"
    depends_on:
      echofront-postgres:
        condition: service_healthy
      echofront-redis:
        condition: service_healthy

  echofront-admin-portal:
    image: nginx:alpine
    container_name: echofront_admin_portal
    ports:
      - "3000:80"
    volumes:
      - ../admin-portal:/usr/share/nginx/html:ro

volumes:
  pgdata:
  redisdata:
